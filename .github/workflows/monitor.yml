name: Crypto Monitor

on:
  schedule:
    # 每 5 分钟检查一次（UTC 时间，GitHub 不保证精确，通常延迟 1-3 分钟）
    - cron: "*/5 * * * *"
  # 允许手动触发（用于测试）
  workflow_dispatch:

permissions:
  # 允许把 state.json 状态文件提交回仓库
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python action_monitor.py

      - name: Commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
